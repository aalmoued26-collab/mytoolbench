# Toolbench — Netlify config (Git-based deploy)
# ALL backend endpoints live in ONE file: fns/api.js  (function name "api").
# Every /api/* request is rewritten to that single function, which routes
# internally. The old netlify/functions folder is NOT used, so any leftover or
# badly-named files there are ignored and cannot break the build.

[build]
  publish = "."
  functions = "fns"

[functions]
  node_bundler = "esbuild"

# Pretty API paths -> the single router function.
# /api/combine -> /.netlify/functions/api/combine (router reads "combine").
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
